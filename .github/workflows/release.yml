name: build-release

# Pushing a tag like v0.1.0 builds TransVoice on Windows, Linux and macOS and attaches the packages to a
# GitHub release: .zip + one-file .exe (Windows), .tar.gz + .deb (Linux), .tar.gz + .dmg (macOS).
# PyInstaller cannot cross-compile, so each OS builds its own packages.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: older glibc, so the Linux build also runs on older distributions.
        # macos-14: Apple Silicon (arm64).
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1

      - name: Install
        run: python -m pip install -r requirements.txt pytest sacrebleu jiwer pyinstaller

      - name: Test and build
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: TransVoice-${{ matrix.os }}
          path: |
            dist/TransVoice-*.zip
            dist/TransVoice-*.tar.gz
            dist/TransVoice-*.exe
            dist/TransVoice-*.dmg
            dist/transvoice_*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TransVoice-*.zip
            dist/TransVoice-*.tar.gz
            dist/TransVoice-*.exe
            dist/TransVoice-*.dmg
            dist/transvoice_*.deb
          generate_release_notes: true
